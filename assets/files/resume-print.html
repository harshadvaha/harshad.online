<html lang="en"><head><meta charset="utf-8"><title>Harshad Vaghasiya — Resume</title>

<!-- Source for Harshad-Vaghasiya-Resume.pdf. Content comes from /content/resume.js.

<style>
@font-face{font-family:YS;src:url(../fonts/young-serif-latin-400-normal.woff2)}
@font-face{font-family:SG;src:url(../fonts/schibsted-grotesk-latin-wght-normal.woff2);font-weight:100 900}
@font-face{font-family:MM;src:url(../fonts/martian-mono-latin-standard-normal.woff2);font-weight:100 900;font-stretch:75% 125%}
html{zoom:0.91}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#16181B;--ink2:#56585B;--ink3:#6A6B65;--line:#D3CEC2;--acc:#8F5300}
body{font-family:SG;color:var(--ink);font-size:8.3pt;line-height:1.3;width:calc(210mm / 0.91);padding:9mm 13mm 6mm}
.mono{font-family:MM;font-stretch:112.5%;letter-spacing:.06em;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.2px solid var(--ink);padding-bottom:3.4mm}
h1{font-family:YS;font-weight:400;font-size:25pt;line-height:1}
.head{font-size:9.4pt;font-weight:500;margin-top:2mm}.head i{color:var(--acc);font-style:normal}
.contact{text-align:right;font-family:MM;font-size:7.2pt;line-height:1.6}
.contact .mono{color:var(--ink2);font-size:6.6pt}
h2{font-size:6.8pt;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:1mm;margin:3mm 0 1.3mm}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:2.6mm}
.facts div{padding:1.8mm 2.4mm;border-left:1px solid var(--line)}.facts div:first-child{border-left:0;padding-left:0}
.facts b{font-family:YS;font-weight:400;font-size:14pt;display:block}.facts span{color:var(--ink2);font-size:7.6pt}
.row{display:grid;grid-template-columns:38mm 1fr;gap:3mm;margin-top:1.5mm}
.row .k{font-weight:600}.row .k small{display:block;font-family:MM;font-stretch:112.5%;font-size:6.6pt;font-weight:400;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;margin-top:.4mm}
.row h3{font-family:YS;font-weight:400;font-size:11.2pt;margin-bottom:.6mm}
ul{list-style:none}li{padding-left:3.4mm;position:relative;margin-bottom:.35mm}li:before{content:"—";position:absolute;left:0;color:var(--ink3)}
li b{font-weight:600}.k.plain{font-weight:400;color:var(--ink2)}
a{color:var(--acc);text-decoration:none}
</style></head><body>
<script src="../../content/resume.js"></script>
<script>
const R=window.RESUME,e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const bold=s=>e(s).replace(/(~?\d+\+?%?)(?=[\s,.;])/g,(m)=>/%|\+/.test(m)?`<b>${m}</b>`:m);
const [h1,h2]=R.headline.split(' · ');
document.body.insertAdjacentHTML('beforeend',`
<header><div><h1>${e(R.name)}</h1><div class="head">${e(h1)} <i>·</i> ${e(h2)}</div></div>
<div class="contact"><div class="mono">${e(R.location)}</div><div>${e(R.email)}</div><div>${e(R.phone)}</div><div>linkedin.com/in/harshadvaha</div><div>harshad.online</div></div></header>
<h2 class="mono">Profile</h2><p>${e(R.summary)}</p>
<div class="facts">${R.facts.map(f=>`<div><b>${e(f.value)}</b><span>${e(f.label)}</span></div>`).join('')}</div>
<h2 class="mono">Experience</h2>
${R.experience.map(j=>`<div class="row"><div class="k">${e(j.company)}<small>${e(j.start)} – ${e(j.end)}</small></div><div><h3>${e(j.role)}</h3><ul>${j.bullets.map(b=>`<li>${bold(b)}</li>`).join('')}</ul></div></div>`).join('')}
<h2 class="mono">Personal project</h2>
<div class="row"><div class="k plain">Pricing case study</div><div><h3 style="font-size:10pt;display:inline">Revenue Leak Audit</h3> <a>· harshad.online/work/revenue-leak-audit</a><div>Pricing leak analysis of 2 years of public e-commerce orders, with a dashboard. Python, Looker Studio, AI.</div></div></div>
<h2 class="mono">Skills</h2>
${R.skills.map(s=>`<div class="row" style="margin-top:1.2mm"><div class="k">${e(s.group)}</div><div>${s.items.map(e).join(' · ')}</div></div>`).join('')}
<h2 class="mono">Education</h2>
<div class="row"><div class="k plain">${e(R.education.place)}</div><div><h3>${e(R.education.degree)}</h3><div>${e(R.education.school)} · ${e(R.education.note)}</div></div></div>
<h2 class="mono">Courses</h2>
<div class="row"><div class="k plain">LinkedIn Learning</div><div>${R.learning.map(l=>e(l.title)).join(' · ')}</div></div>`);
</script></body></html>
